# Tooling config only — the project runs from source (não é empacotado).
# Health Stack: ruff (lint) + mypy (type check) + pytest (tests).

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data", "logs", "frontend"]

[tool.ruff.lint]
# High-signal baseline: bugs reais (pyflakes E/F + bugbear B). isort (I) fica de
# fora por ora — evita churn nos imports inline dos testes; foco em pegar bug.
select = ["E", "F", "B"]
ignore = ["E501"]  # linhas longas são pervasivas e de baixo risco — não vale o churn agora

[tool.ruff.lint.per-file-ignores]
# bootstrap roda load_dotenv() ANTES de importar config (de propósito) → E402 ok aqui.
"backend/bootstrap.py" = ["E402"]
"backend/main.py" = ["E402"]
"backend/jobs/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend"]
ignore_missing_imports = true      # sem stubs p/ telegram/httpx/flask/openpyxl/waitress/dotenv
explicit_package_bases = true
namespace_packages = true
warn_redundant_casts = true
warn_unused_ignores = true

# Bordas de framework são fricção de tipagem, não bug — relaxa lá, mantém o CORE
# (lógica de dinheiro em core/) sob checagem estrita:
#   - Flask: rotas retornam (Response, status) que o Flask aceita, mas a annotation
#     `-> Response` não cobre a tupla → [return-value].
#   - python-telegram-bot: `effective_chat`/`message` são `... | None`, mas os
#     handlers só rodam com eles presentes (gate de auth) → [union-attr].
[[tool.mypy.overrides]]
module = ["dashboard.server", "bot.handlers.*"]
disable_error_code = ["return-value", "union-attr"]
