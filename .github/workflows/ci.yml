name: CI

# Health Stack server-side: same gate as the local .githooks/pre-commit, but it
# can't be skipped with --no-verify. Runs on every push/PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  health-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # floor: código usa 3.12+; mypy mira 3.12
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check backend tests

      - name: Mypy (type check)
        run: mypy backend

      - name: Pytest
        run: pytest
        env:
          PYTHONPATH: backend
